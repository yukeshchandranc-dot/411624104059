<!DOCTYPE html>
<html >
<head>
  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>

    <style>

        body{
            margin: 20px;
        }

        nav{
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: lightgray;
            padding: 10px;
        }

        nav a{
          
            color: black;
        }

        
        @media(min-width:1024px){
            nav{
                flex-direction: row;
                gap: 30px;
            }
        }

        
        img{
            width: 300px;
            border-radius: 20px; 
        }

       
        video{
            width: 50vw;
            padding: 10px;
            background-color: blue; 
        }

       
      table{
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        th{
            background-color: lightblue;
        }

        
        button{
            border: none;
            padding: 12px 20px;
            background-color: blue; 
            color: white;
            margin: 20px;
            cursor: pointer;
        }

        button:hover{
            background-color: brown;
        }

      
        .grid{
            display: grid;
            grid-template-columns: 25%  25% 25%  25%;
            gap: 10px;
            margin-top: 20px;
        }

        .box{
            background-color: rgb(81, 120, 90);
            padding: 20px;
            text-align: center;
        }

        
        @media(max-width:px){
            .grid{
                grid-template-columns: 10px;
            }
        }
    </style>
</head>
<body>

   
    <nav>
        <a >Home</a>
        <a >About</a>
        <a >Contact</a>
    </nav>

   
    <h1>Responsive Website</h1>

   
    <img src="img3.jpg" alt="Sample Image">

    <br><br>

    
    <video controls>
        <source src="clock.mp4" type="video/mp4">
    </video>

  
    <table>
        <tr>
            <th>1</th>
            <th>some text</th>
            <th>some text</th>
        </tr>
        <tr>
            <td>2</td>
            <td>some text</td>
            <td>some text</td>
        </tr>
        <tr>
            <td>3</td>
            <td>some text</td>
            <td>some text</td>
        </tr>
    </table>

  
    <button>Click Me</button>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>

</body>
</html>
